<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Hone particle studio. Five specimens drawn in smooth circular particles, with hover, morphs and a self-contained HTML export." />
    <title>Hone · Particles</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/src/editor/studio.css" />
    <link rel="stylesheet" href="/src/editor/pane.css" />
    <style id="hone-chrome">
      /* Client request: on the page only the specimen, the HONE mark, the
         bottom-left index and the top-right Controls toggle. Count lives in
         the panel (Particles > Count). */
      .pv-plate, .pv-count, .pv-stats { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stage" class="pv-stage" aria-label="Particle specimen"></div>
    <img id="pv-reference" class="pv-reference" alt="" hidden />

    <div id="ui" class="pv-ui">
      <div class="pv-marks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

      <header class="pv-mast">
        
        <div class="pv-mast-t">
          <h1 class="pv-word"><svg class="pv-hone" viewBox="0 0 1856 472" role="img" aria-label="Hone" style="display:block;height:15px;width:auto;fill:currentColor"><path d="M0 461.065C34.8573 453.354 41.6921 390.325 41.6921 362.673V108.674C41.6921 81.6607 34.8573 18.0098 0 10.9375H209.828C174.97 18.0098 167.452 81.678 167.452 108.674V207.703H326.36V108.674C326.36 81.6607 319.526 18.0098 284.668 10.9375H494.496C459.639 18.0098 452.12 81.678 452.12 108.674V362.673C452.12 390.325 459.639 453.337 494.496 461.065H284.668C319.526 453.354 326.36 390.325 326.36 362.673V266.852H167.452V362.673C167.452 390.325 174.97 453.337 209.828 461.065H0Z"/><path d="M491.353 236.009C491.353 105.464 601.376 0 738.071 0C874.767 0 984.807 105.464 984.807 236.009C984.807 366.553 874.083 472.017 738.071 472.017C602.059 472.017 491.336 365.915 491.336 236.009H491.353ZM616.361 236.009C616.361 331.175 670.629 408.349 738.071 408.349C805.513 408.349 859.782 331.175 859.782 236.009C859.782 140.843 805.513 63.6682 738.071 63.6682C670.629 63.6682 616.361 140.843 616.361 236.009Z"/><path d="M984.805 461.065C1018.98 453.993 1026.5 394.188 1027.18 365.899V106.103C1026.5 77.8141 1018.98 18.0098 984.805 10.9375H1161.14L1344.31 297.091V106.103C1343.63 77.8141 1336.11 18.0098 1301.94 10.9375H1452.99C1418.13 18.0098 1411.29 81.678 1411.29 108.674V461.065H1294.42L1094.16 146.605V369.746C1094.84 399.329 1103.73 453.993 1135.85 461.065H984.805Z"/><path d="M1470.52 461.065C1505.38 453.354 1512.9 390.325 1512.9 362.673V108.674C1512.9 81.6607 1505.38 18.0098 1470.52 10.9375H1832.76L1842.33 158.197C1836.86 140.189 1808.16 68.8098 1705.64 68.8098H1639.34V205.789C1687.18 201.925 1734.34 188.418 1743.91 151.125V320.895C1734.34 283.601 1687.18 270.095 1639.34 266.231V403.21H1719.31C1821.83 403.21 1850.53 331.831 1856 313.823L1846.43 461.082H1470.52V461.065Z"/></svg></h1>
          <p class="pv-cap" style="margin-top:8px">Particle studio</p>
        </div>
      </header>

      <dl class="pv-plate" id="pv-plate" aria-live="polite"></dl>

      <nav class="pv-index" id="pv-index" aria-label="Specimens"></nav>

      <div class="pv-count" id="pv-count"></div>

      <div class="pv-stats" id="pv-stats" aria-hidden="true"></div>

      <button class="pv-fab" id="pv-fab" type="button" aria-controls="pv-panel" aria-expanded="false"></button>

      <aside class="pv-panel" id="pv-panel" aria-label="Controls">
        <div class="pv-panel-h">
          <span class="pv-panel-t">Controls</span>
          <span class="pv-panel-a" id="pv-panel-actions"></span>
        </div>
        <div class="pv-pane" id="pv-pane"></div>
        <div class="pv-panel-f" id="pv-keys"></div>
      </aside>

      <section class="pv-sheet" id="pv-sheet" aria-label="Custom specimen" hidden></section>

      <div class="pv-toasts" id="pv-toasts" role="status" aria-live="polite"></div>
    </div>

    <div class="pv-drop" id="pv-drop" aria-hidden="true">
      <div class="pv-drop-f">
        <p class="pv-drop-t">Drop to make a specimen</p>
        <p class="pv-drop-s">PNG · JPG · SVG · GLB · GLTF · OBJ · STL</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
