<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulviscolo · shape preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #222; }
      canvas { display: block; width: 100vw; height: 100vh; }
      .lbl { position: fixed; padding: 6px 8px; letter-spacing: .04em; text-transform: uppercase; color: #777; pointer-events: none; }
      #info { position: fixed; left: 8px; bottom: 6px; color: #444; }
      #err { position: fixed; inset: 0; padding: 24px; color: #b00; white-space: pre-wrap; background: #fff; display: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="info"></div>
    <pre id="err"></pre>
    <script type="module" src="/src/preview.js"></script>
  </body>
</html>
